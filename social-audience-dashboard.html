<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>18-34岁女性 社媒受众看板</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --ig: #E1306C; --ig-bg: #fce4ec;
    --fb: #1877F2; --fb-bg: #e3f2fd;
    --tk: #6a1b9a; --tk-bg: #f3e5f5;
    --bg: #f5f5f7; --card: #fff;
    --text: #1d1d1f; --text2: #6e6e73; --border: #e5e5ea;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); padding: 24px;
  }
  .container { max-width: 1280px; margin:0 auto; }
  .header { text-align:center; padding:32px 0 24px; }
  .header h1 { font-size:28px; font-weight:600; letter-spacing:-0.5px; }
  .header p { color:var(--text2); font-size:14px; margin-top:6px; }
  
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:24px; }
  .sc { background:var(--card); border-radius:14px; padding:20px; border:1px solid var(--border); text-align:center; }
  .sc .l { font-size:11px; color:var(--text2); font-weight:600; letter-spacing:0.5px; }
  .sc .v { font-size:24px; font-weight:700; margin-top:4px; }
  .sc .s { font-size:12px; color:var(--text2); margin-top:4px; }
  .sc.ig .v { color:var(--ig); } .sc.fb .v { color:var(--fb); } .sc.tk .v { color:var(--tk); }
  
  .charts { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:24px; }
  .cc { background:var(--card); border-radius:14px; padding:20px; border:1px solid var(--border); }
  .cc h3 { font-size:13px; font-weight:600; margin-bottom:12px; color:var(--text2); }
  .cc canvas { max-height:320px; }

  .table-wrapper { background:var(--card); border-radius:14px; border:1px solid var(--border); overflow:hidden; }
  .thdr { padding:14px 20px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
  .thdr h3 { font-size:14px; font-weight:600; }
  .leg { display:flex; gap:14px; font-size:12px; }
  .leg-item { display:flex; align-items:center; gap:6px; }
  .dot { width:10px; height:10px; border-radius:50%; display:inline-block; }
  
  table { width:100%; border-collapse:collapse; font-size:13px; }
  thead th { background:#fafafa; text-align:center; padding:10px 6px; font-weight:600; font-size:11px; color:var(--text2); letter-spacing:0.3px; border-bottom:1px solid var(--border); }
  thead th:first-child { text-align:center; }
  thead th:nth-child(2) { text-align:left; padding-left:12px; }
  tbody td { padding:10px 6px; text-align:center; border-bottom:1px solid #f0f0f0; }
  tbody td:nth-child(2) { text-align:left; padding-left:12px; font-weight:500; }
  tbody tr:hover { background:#f9f9f9; }
  
  .badge { display:inline-block; padding:2px 10px; border-radius:20px; font-size:11px; font-weight:600; }
  .b-ig { background:var(--ig-bg); color:var(--ig); }
  .b-tk { background:var(--tk-bg); color:var(--tk); }
  .bar-w { width:100%; max-width:140px; margin:0 auto; height:6px; background:#eee; border-radius:3px; overflow:hidden; display:flex; }
  .bar-ig { height:100%; background:var(--ig); }
  .bar-fb { height:100%; background:var(--fb); }
  .bar-tk { height:100%; background:var(--tk); }
  .total-row td { font-weight:600; background:#f8f8fa; border-top:2px solid var(--border); }
  .total-row td:first-child { text-align:center; }

  .findings { margin-top:24px; display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .fc { background:var(--card); border-radius:14px; padding:18px 20px; border:1px solid var(--border); font-size:13px; line-height:1.6; }
  .fc .t { font-weight:600; font-size:11px; color:var(--text2); letter-spacing:0.5px; margin-bottom:6px; }
  
  @media(max-width:768px) { .stats { grid-template-columns:repeat(2,1fr); } .charts { grid-template-columns:1fr; } .findings { grid-template-columns:1fr; } body { padding:12px; } }
</style>
</head>
<body>
<div class="container" id="app"></div>

<script>
const igR = [
  [6900000,8200000],[1100000,1300000],[30500000,35900000],[13400000,15800000],
  [20300000,23800000],[28100000,33000000],[53400000,62900000],[6100000,7200000],
  [28100000,33000000],[43800000,51500000],[3900000,4600000],[4800000,5600000],
  [903600,1100000],[10400000,12200000],[8900000,10400000],[8100000,9500000],
  [7000000,8200000],[6700000,7800000]];
const fbR = [
  [3900000,4600000],[520400,612200],[27800000,32700000],[11000000,13000000],
  [19200000,22600000],[20100000,23600000],[29300000,34500000],[3400000,4000000],
  [21700000,25500000],[17600000,20700000],[2100000,2400000],[2800000,3300000],
  [538700,633700],[5700000,6700000],[4400000,5100000],[2600000,3000000],
  [3000000,3600000],[2100000,2500000]];
const tkR = [
  [11913000,14562000],[1566000,1916000],[32356000,39548000],[21889000,26754000],
  [35522000,43417000],[11329000,13847000],[30677000,37495000],[4487000,5486000],
  [29112000,35583000],[34951000,42719000],[4126000,5044000],[3266000,3993000],
  [630000,771000],[7091000,8668000],[6213000,7595000],[7141000,8729000],
  [4882000,5968000],[4270000,5220000]];
const cnames = ['马来西亚','新加坡','菲律宾','泰国','越南','印尼（雅加达省）','美国','加拿大','墨西哥','巴西','智利','澳大利亚','新西兰','英国','法国','德国','意大利','西班牙'];
const regs = ['东南亚','东南亚','东南亚','东南亚','东南亚','东南亚','北美','北美','中南美','中南美','中南美','大洋洲','大洋洲','欧洲','欧洲','欧洲','欧洲','欧洲'];
const rcolors = {东南亚:'#FF9800',北美:'#2196F3',中南美:'#4CAF50',大洋洲:'#00BCD4',欧洲:'#9C27B0'};

function mid(a,b){return (a+b)/2;}
function fw(v){const w=v/10000;return w===Math.floor(w)?Math.floor(w).toLocaleString()+'w':w.toLocaleString(undefined,{minFrac:1,maxFrac:1})+'w';}

let igT=0,fbT=0,tkT=0;
igR.forEach(d=>igT+=mid(d[0],d[1]));
fbR.forEach(d=>fbT+=mid(d[0],d[1]));
tkR.forEach(d=>tkT+=mid(d[0],d[1]));
const at=igT+fbT+tkT;
const igP=Math.round(igT/at*1000)/10;
const fbP=Math.round(fbT/at*1000)/10;
const tkP=Math.round(tkT/at*1000)/10;

const data=[];
let igL=0,tkL=0,igS=0,tkS=0;
for(let i=0;i<18;i++){
  const im=mid(igR[i][0],igR[i][1]);
  const fm=mid(fbR[i][0],fbR[i][1]);
  const tm=mid(tkR[i][0],tkR[i][1]);
  const t2=im+fm+tm;
  const ip=Math.round(im/t2*1000)/10;
  const fp=Math.round(fm/t2*1000)/10;
  const tp=Math.round(tm/t2*1000)/10;
  const ld=ip>=fp&&ip>=tp?'IG':(fp>=ip&&fp>=tp?'FB':'TK');
  if(ld==='IG') igL++; else tkL++;
  if(ip>40) igS++;
  if(tp>40) tkS++;
  data.push({c:cnames[i],r:regs[i],im,fm,tm,t2,ip,fp,tp,ld});
}

function rng(v){const mn=v[0]/10000,mx=v[1]/10000;const mns=mn===Math.floor(mn)?Math.floor(mn).toLocaleString():mn.toLocaleString(undefined,{minFrac:1,maxFrac:1});const mxs=mx===Math.floor(mx)?Math.floor(mx).toLocaleString():mx.toLocaleString(undefined,{minFrac:1,maxFrac:1});return mns+'w-'+mxs+'w';}
function bg(ld){return ld==='IG'?'<span class="badge b-ig">IG</span>':'<span class="badge b-tk">TK</span>';}
function bar(ig,fb,tk){return '<div class="bar-w"><div class="bar-ig" style="width:'+ig+'%"></div><div class="bar-fb" style="width:'+fb+'%"></div><div class="bar-tk" style="width:'+tk+'%"></div></div>';}

render();
function render(){
  let tr='';
  data.forEach(r=>{
    tr+='<tr><td style="color:'+rcolors[r.r]+';font-weight:600;font-size:11px">'+r.r+'</td><td>'+r.c+'</td><td>'+rng([igR[data.indexOf(r)][0],igR[data.indexOf(r)][1]])+'</td><td>'+rng([fbR[data.indexOf(r)][0],fbR[data.indexOf(r)][1]])+'</td><td>'+rng([tkR[data.indexOf(r)][0],tkR[data.indexOf(r)][1]])+'</td><td>'+rng([igR[data.indexOf(r)][0]+fbR[data.indexOf(r)][0]+tkR[data.indexOf(r)][0],igR[data.indexOf(r)][1]+fbR[data.indexOf(r)][1]+tkR[data.indexOf(r)][1]])+'</td><td>'+bar(r.ip,r.fp,r.tp)+'</td><td>'+r.ip+'%</td><td>'+r.fp+'%</td><td>'+r.tp+'%</td><td>'+bg(r.ld)+'</td></tr>';
  });

  const igLN=data.filter(r=>r.ld==='IG').map(r=>r.c).join('、');
  const tkLN=data.filter(r=>r.ld==='TK').map(r=>r.c).join('、');
  const tkSN=data.filter(r=>r.tp>40).map(r=>r.c).join('、');
  const igSN=data.filter(r=>r.ip>40).map(r=>r.c).join('、');

  document.getElementById('app').innerHTML=`
    <div class="header">
      <h1>18-34岁女性 · 社媒广告受众覆盖</h1>
      <p>Instagram / Facebook / TikTok ｜ 中间值</p>
    </div>

    <div class="stats">
      <div class="sc ig"><div class="l">Instagram</div><div class="v">${fw(igT)}</div><div class="s">占 ${igP}% · 领先 ${igL}国 · 强势 ${igS}国</div></div>
      <div class="sc fb"><div class="l">Facebook</div><div class="v">${fw(fbT)}</div><div class="s">占 ${fbP}% · 领先 0国</div></div>
      <div class="sc tk"><div class="l">TikTok</div><div class="v">${fw(tkT)}</div><div class="s">占 ${tkP}% · 领先 ${tkL}国 · 强势 ${tkS}国</div></div>
    </div>

    <div class="charts">
      <div class="cc"><h3>各平台受众总量（万）</h3><canvas id="c1"></canvas></div>
      <div class="cc"><h3>TOP8 国家三平台分布</h3><canvas id="c2"></canvas></div>
    </div>

    <div class="table-wrapper">
      <div class="thdr">
        <h3>18国完整数据</h3>
        <div class="leg">
          <span class="leg-item"><span class="dot" style="background:#E1306C"></span> IG</span>
          <span class="leg-item"><span class="dot" style="background:#1877F2"></span> FB</span>
          <span class="leg-item"><span class="dot" style="background:#6a1b9a"></span> TK</span>
        </div>
      </div>
      <table>
        <thead><tr>
          <th>区域</th><th>国家/地区</th><th>Instagram</th><th>Facebook</th><th>TikTok</th><th>合计</th>
          <th style="width:150px">占比分布</th><th>IG%</th><th>FB%</th><th>TK%</th><th>占比最高</th>
        </tr></thead>
        <tbody>${tr}
          <tr class="total-row">
            <td></td><td>合计</td><td>${fw(igT)}</td><td>${fw(fbT)}</td><td>${fw(tkT)}</td><td>${fw(at)}</td><td>${bar(igP,fbP,tkP)}</td><td>${igP}%</td><td>${fbP}%</td><td>${tkP}%</td><td>—</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="findings">
      <div class="fc"><div class="t">整体格局</div>18国合计${fw(at)}，IG占${igP}%、FB占${fbP}%、TK占${tkP}%。</div>
      <div class="fc"><div class="t">各国领先平台</div>IG在${igL}国领先（${igLN}）；TikTok在${tkL}国领先（${tkLN}）。</div>
      <div class="fc"><div class="t">TikTok强势市场</div>${tkS}国TK占比&gt;40%（${tkSN}）。</div>
      <div class="fc"><div class="t">Instagram强势市场</div>${igS}国IG占比&gt;40%（${igSN}）。</div>
    </div>
  `;

  new Chart(c1,{type:'bar',data:{labels:['Instagram','Facebook','TikTok'],datasets:[{data:[igT/10000,fbT/10000,tkT/10000],backgroundColor:['#E1306C','#1877F2','#6a1b9a'],borderRadius:6,barThickness:50}]},options:{responsive:true,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>ctx.raw.toLocaleString(undefined,{minFrac:1,maxFrac:1})+'w'}}},scales:{y:{beginAtZero:0,ticks:{callback:v=>v.toLocaleString()+'w'}},x:{grid:{display:false}}}}});

  const t8=[...data].sort((a,b)=>b.t2-a.t2).slice(0,8);
  new Chart(c2,{type:'bar',data:{labels:t8.map(r=>r.c),datasets:[
    {label:'IG',data:t8.map(r=>r.im/10000),backgroundColor:'#E1306C',borderRadius:3},
    {label:'FB',data:t8.map(r=>r.fm/10000),backgroundColor:'#1877F2',borderRadius:3},
    {label:'TK',data:t8.map(r=>r.tm/10000),backgroundColor:'#6a1b9a',borderRadius:3}
  ]},options:{responsive:true,plugins:{legend:{position:'top',labels:{boxWidth:12,font:{size:11}}},tooltip:{callbacks:{label:ctx=>ctx.dataset.label+': '+ctx.raw.toLocaleString(undefined,{minFrac:1,maxFrac:1})+'w'}}},scales:{x:{grid:{display:false}},y:{beginAtZero:0,ticks:{callback:v=>v.toLocaleString()+'w'}}}}});
}
</script>
</body>
</html>
