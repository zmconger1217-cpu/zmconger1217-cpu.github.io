<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>珠宝市场看板</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Noto Sans SC','Segoe UI',sans-serif;background:#f8f8f8;color:#222;min-height:100vh}
a{color:#222;text-decoration:none}

.nav{display:flex;align-items:center;gap:0;background:#fff;border-bottom:1px solid #eee;padding:0 24px}
.nav a{display:flex;align-items:center;gap:6px;padding:14px 18px;font-size:12px;color:#999;border-bottom:2px solid transparent;transition:all .2s}
.nav a:hover{color:#555}
.nav a.active{color:#000;border-bottom-color:#000;background:linear-gradient(0deg,#00000006,transparent)}
.nav a span{font-size:14px}
@media(max-width:640px){.nav{padding:0 14px;overflow-x:auto}}

.header{display:flex;justify-content:space-between;align-items:center;padding:20px 24px 12px}
.h-left{display:flex;align-items:center;gap:10px}
.h-left h1{font-size:17px;font-weight:600;color:#222}
.status-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#4caf50;margin-right:4px}
.status{font-size:11px;color:#bbb;display:flex;align-items:center;gap:4px}
.meta{font-size:11px;color:#bbb}
.meta b{color:#999}

.wrap{max-width:1440px;margin:0 auto;padding:0 24px 24px}
.grid{display:grid;gap:12px;margin-bottom:12px}
.g4{grid-template-columns:repeat(4,1fr)}
.g2{grid-template-columns:1fr 1fr}

.insight{margin-bottom:14px;padding:12px 16px;background:#fff;border:1px solid #eee;border-radius:8px;display:none;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:#999;line-height:1.6}
.insight.show{display:flex}
.insight i{font-style:normal;color:#000}

.card{background:#fff;border-radius:10px;padding:16px;border:1px solid #eee}
.card:hover{box-shadow:0 2px 8px rgba(0,0,0,.04)}
.card .lbl{font-size:10px;color:#bbb;text-transform:uppercase;letter-spacing:.3px;margin-bottom:2px}
.card .val{font-size:24px;font-weight:400;color:#000;line-height:1.2}
.card .chg{font-size:10px;padding:1px 7px;border-radius:5px;margin-left:5px;vertical-align:middle}
.card .chg.up{color:#4caf50;background:#4caf5008}
.card .chg.down{color:#ef5350;background:#ef535008}
.card .sub{font-size:10px;color:#ccc;margin-top:1px}

.cc{background:#fff;border-radius:10px;padding:16px;border:1px solid #eee}
.cc h3{font-size:11px;font-weight:500;color:#666;margin-bottom:10px;display:flex;align-items:center;gap:5px}
.cb{width:100%;height:360px}
.cb-sm{width:100%;height:280px}

.tw{overflow-x:auto;border-radius:8px;background:#fff;border:1px solid #eee;margin-bottom:16px}
table{width:100%;border-collapse:collapse;font-size:11px;table-layout:fixed}
th{color:#bbb;padding:10px 11px;text-align:left;font-weight:400;font-size:9px;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid #eee}
td{padding:9px 11px;border-bottom:1px solid #f5f5f5;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafafa}
.col-rank{width:28px;text-align:center}
.col-title{width:auto}
.col-title a{color:#000;text-decoration:none;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col-num{width:80px;text-align:right;font-variant-numeric:tabular-nums}
.col-region{width:56px;text-align:center}
.col-prod{width:64px;text-align:center}
.col-fmt{width:72px;text-align:center}
.col-score{width:36px;text-align:center}
.hl{color:#000;font-weight:500}
.rn{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:3px;font-size:9px;font-weight:500}
.r1{background:#0000000a;color:#000}.r2{background:#5555550a;color:#555}.r3{background:#9999990a;color:#777}
.ro{background:#f5f5f5;color:#bbb}

.video-section{margin-top:4px;margin-bottom:12px}
.video-section h3{font-size:12px;font-weight:500;color:#666;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.video-card{background:#fff;border-radius:10px;border:1px solid #eee;overflow:hidden;transition:all .2s}
.video-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.06);transform:translateY(-2px)}
.video-cover{width:100%;aspect-ratio:9/16;background:#f5f5f5;display:flex;align-items:center;justify-content:center;color:#ddd;font-size:12px;overflow:hidden;position:relative}
.video-cover img{width:100%;height:100%;object-fit:cover}
.video-cover .play-badge{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,.55);color:#fff;font-size:9px;padding:2px 7px;border-radius:4px}
.video-info{padding:8px 10px}
.video-info .vtitle{font-size:10px;color:#555;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:3px}
.video-info .vstats{display:flex;gap:8px;font-size:9px;color:#bbb}
.ft{text-align:center;padding:16px 0 6px;font-size:10px;color:#eee}

@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){
  .wrap{padding:0 14px}.nav{padding:0 14px;overflow-x:auto}
  .g4,.g2{grid-template-columns:1fr}
  .card .val{font-size:20px}.cb,.cb-sm{height:220px}
  .video-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<div class="nav">
  <a href="brand.html"><span>◈</span> 品牌</a>
  <a href="market.html" class="active"><span>◈</span> 市场</a>
</div>

<div class="header">
  <div class="h-left"><h1>◆ 珠宝市场</h1><span class="status"><span class="status-dot"></span>TikTok</span></div>
  <div class="meta"><b id="updateTime">加载中...</b></div>
</div>

<div class="wrap">

  <div class="insight" id="insightBar">
    <div id="insightText" style="display:flex;flex-wrap:wrap;gap:2px 16px"></div>
  </div>

  <div class="grid g4" id="kpiCards"></div>

  <div class="grid g2">
    <div class="cc"><h3>🌍 国家分布</h3><div class="cb" id="chartGeo"></div></div>
    <div class="cc"><h3>💍 品类分布</h3><div class="cb" id="chartProduct"></div></div>
  </div>

  <div class="grid g2">
    <div class="cc"><h3>📈 播放趋势</h3><div class="cb" id="chartTrend"></div></div>
    <div class="cc"><h3>🏆 策略评分</h3><div class="cb-sm" id="chartRank"></div></div>
  </div>

  <div class="video-section">
    <h3>🔥 近7天爆款</h3>
    <div class="video-grid" id="videoGrid"></div>
  </div>

  <div class="tw" id="detailTable"></div>

</div>

<div class="ft">TikTok 数据分析 · 每日更新</div>

<script>
function E(id){return echarts.init(document.getElementById(id))}
function R(c){window.addEventListener('resize',()=>c.resize())}
function F(n){return (n||0).toLocaleString()}

fetch('data.json?'+Date.now()).then(r=>r.json()).then(d=>{
  document.getElementById('updateTime').textContent='更新 '+d.updatedAt
  renderKPI(d.kpi);renderInsight(d.insights)
  if(d.geo) renderGeo(d.geo)
  if(d.pie) renderProduct(d.pie)
  if(d.trend) renderTrend(d.trend)
  if(d.rank) renderRank(d.rank)
  if(d.details){renderVideos(d.details.slice(0,12));renderTable(d.details)}
}).catch(()=>{document.getElementById('updateTime').textContent='⚠️ 加载失败';loadDemo()})

function renderKPI(arr){
  const el=document.getElementById('kpiCards');el.innerHTML=''
  ;(arr||[]).forEach(i=>{
    const c=i.chg?(i.chg[0]=='+'?'up':'down'):''
    el.innerHTML+=`<div class="card"><div class="lbl">${i.label}</div><div class="val">${i.value}${i.chg?`<span class="chg ${c}">${i.chg}</span>`:''}</div><div class="sub">${i.sub||''}</div></div>`
  })
}
function renderInsight(arr){
  if(!arr||!arr.length)return
  document.getElementById('insightBar').classList.add('show')
  document.getElementById('insightText').innerHTML=arr.map(i=>`<i>${i.text}</i>`).join('')
}
function renderGeo(g){
  const c=E('chartGeo')
  c.setOption({
    tooltip:{trigger:'item',formatter:'{b}: {c}%'},
    grid:{left:80,right:20,top:6,bottom:16},
    xAxis:{type:'value',splitLine:{lineStyle:{color:'#eee'}},axisLabel:{color:'#bbb',fontSize:9,formatter:'{value}%'}},
    yAxis:{type:'category',data:(g.labels||[]).slice().reverse(),axisLabel:{color:'#888',fontSize:10}},
    series:[{type:'bar',data:(g.values||[]).slice().reverse(),barWidth:14,borderRadius:[0,4,4,0],itemStyle:{color:'#555'},label:{show:true,position:'right',color:'#888',fontSize:9,formatter:'{c}%'}}]
  });R(c)
}
function renderProduct(p){
  const c=E('chartProduct')
  c.setOption({
    tooltip:{trigger:'item',formatter:'{b}: {c}%'},
    series:[{type:'pie',radius:['28%','58%'],center:['50%','48%'],data:p.data||(p.labels||[]).map((n,i)=>({name:n,value:(p.values||[])[i]||0})),label:{color:'#888',fontSize:9},labelLine:{lineStyle:{color:'#eee'}},color:['#333','#666','#999','#bbb','#ddd','#eee'],emphasis:{scale:false}}]
  });R(c)
}
function renderTrend(t){
  const c=E('chartTrend')
  c.setOption({
    tooltip:{trigger:'axis',valueFormatter:v=>v.toLocaleString()},
    grid:{left:42,right:10,top:12,bottom:16},
    xAxis:{type:'category',data:t.labels,axisLabel:{color:'#bbb',fontSize:9}},
    yAxis:{type:'value',splitLine:{lineStyle:{color:'#eee'}},axisLabel:{color:'#bbb'}},
    series:[{type:'line',data:t.values,smooth:true,symbol:'circle',symbolSize:4,lineStyle:{color:'#444',width:2},areaStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:'#00000006'},{offset:1,color:'#00000000'}]}},itemStyle:{color:'#333'},markLine:{data:[{type:'average'}],lineStyle:{color:'#ddd',type:'dashed'},label:{color:'#bbb',fontSize:9,formatter:'均 {c}'}}}]
  });R(c)
}
function renderRank(r){
  const c=E('chartRank')
  c.setOption({
    tooltip:{trigger:'axis',axisPointer:{type:'shadow'}},
    grid:{left:70,right:16,top:4,bottom:12},
    xAxis:{type:'value',splitLine:{lineStyle:{color:'#eee'}},axisLabel:{color:'#bbb'}},
    yAxis:{type:'category',data:(r.labels||[]).slice().reverse(),axisLabel:{color:'#888',fontSize:9}},
    series:[{type:'bar',data:(r.values||[]).slice().reverse(),barWidth:10,borderRadius:[0,3,3,0],itemStyle:{color:'#555'},label:{show:true,position:'right',color:'#888',fontSize:8,formatter:'{c}'}}]
  });R(c)
}
function renderVideos(videos){
  const el=document.getElementById('videoGrid')
  if(!videos||!videos.length){el.innerHTML='<div style="grid-column:1/-1;padding:32px;text-align:center;color:#ccc;background:#fff;border-radius:10px;border:1px solid #eee">暂无数据</div>';return}
  el.innerHTML=videos.map(v=>{
    let cover='📹'
    if(v.cover) cover=`<img src="${v.cover}" alt="" loading="lazy" crossorigin="anonymous" referrerpolicy="no-referrer" onerror="this.onerror=null;this.parentElement.innerHTML='📹'">`
    return `<a href="${v.url||'#'}" target="_blank" class="video-card"><div class="video-cover">${cover}${v.views?`<span class="play-badge">${F(v.views)}</span>`:''}</div><div class="video-info"><div class="vtitle">${v.title||'无标题'}</div><div class="vstats"><span>❤️ ${F(v.likes||0)}</span><span>🌍 ${v.region||'--'}</span></div></div></a>`
  }).join('')
}
function renderTable(d){
  const el=document.getElementById('detailTable')
  if(!d||!d.length){el.innerHTML='<div style="padding:24px;color:#ccc;text-align:center">暂无数据</div>';return}
  let h='<table><colgroup><col class="col-rank"><col class="col-title"><col class="col-num"><col class="col-num"><col class="col-region"><col class="col-prod"><col class="col-fmt"><col class="col-score"></colgroup><thead><tr><th>#</th><th>标题</th><th class="col-num">播放</th><th class="col-num">互动率</th><th class="col-region">国家</th><th class="col-prod">品类</th><th class="col-fmt">形式</th><th class="col-score">评分</th></tr></thead><tbody>'
  d.forEach((v,i)=>{
    const r=i<3?'r'+(i+1):'ro'
    const t=v.url?`<a href="${v.url}" target="_blank" title="${(v.title||'').replace(/"/g,'&quot;')}">${v.title||'--'} ↗</a>`:`<span>${v.title||'--'}</span>`
    h+=`<tr><td class="col-rank"><span class="rn ${r}">${i+1}</span></td><td class="col-title">${t}</td><td class="col-num hl">${F(v.views)}</td><td class="col-num">${v.engagement_rate||'--'}</td><td class="col-region">${v.region||'--'}</td><td class="col-prod">${v.product_type||'--'}</td><td class="col-fmt">${v.content_format||'--'}</td><td class="col-score">${v.buzz_score||'--'}</td></tr>`
  })
  h+='</tbody></table>';el.innerHTML=h
}
function loadDemo(){
  renderKPI([{label:'总播放',value:'7.79M',chg:'+12%'},{label:'总粉丝',value:'35.2K'},{label:'互动率',value:'8.4%'},{label:'最热市场',value:'US/CA'}])
  renderGeo({labels:['US/CA','LATAM','SEA'],values:[95,3,2]})
  renderProduct({labels:['Necklace','Ring','Bracelet'],values:[35,25,15]})
  renderTrend({labels:['6/19','6/20','6/21','6/22','6/23','6/24','6/25'],values:[1355,2100,980,1650,810,2200,1800]})
  renderRank({labels:['手工','其他','新奇特'],values:[92,85,82]})
}
</script>
</body>
</html>
