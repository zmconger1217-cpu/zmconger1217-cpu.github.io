<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据仪表盘</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Noto Sans SC','Segoe UI',sans-serif;background:#0b0b0b;color:#eee;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.wrap{max-width:600px;width:100%;text-align:center}
.logo{font-size:48px;margin-bottom:8px}
h1{font-size:24px;font-weight:300;color:#fff;margin-bottom:6px}
h1 span{color:#ffc832}
p{font-size:13px;color:#444;margin-bottom:32px}
.cards{display:grid;gap:14px}
.card{background:#111;border:1px solid #181818;border-radius:12px;padding:24px;text-align:left;transition:all .25s;cursor:pointer;display:flex;align-items:center;gap:18px}
.card:hover{background:#141414;border-color:#2a2a2a;transform:translateY(-2px)}
.card-icon{font-size:32px;flex-shrink:0;width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.card-icon.brand{background:linear-gradient(135deg,#ffc83222,#e6a80011)}
.card-icon.market{background:linear-gradient(135deg,#4fc3f722,#0288d111)}
.card h2{font-size:16px;font-weight:500;color:#eee;margin-bottom:3px}
.card .desc{font-size:12px;color:#555;line-height:1.5}
.card .tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:4px;background:#181818;color:#555;margin-top:6px}
a{text-decoration:none;color:inherit}
.ft{text-align:center;padding:24px 0 6px;font-size:10px;color:#151515}
@media(max-width:480px){
  h1{font-size:20px}
  .card{padding:18px}
  .card-icon{width:44px;height:44px;font-size:26px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">◈</div>
  <h1><span>数据</span>仪表盘</h1>
  <p>TikTok 珠宝品类 · 品牌监测 · 市场分析</p>

  <div class="cards">
    <a href="brand.html">
      <div class="card">
        <div class="card-icon brand">🏪</div>
        <div>
          <h2>MindJewel 品牌</h2>
          <div class="desc">品牌账号数据追踪 · 粉丝增长 · 点赞趋势 · 对比市场基准</div>
          <div class="tag">@mindjewel.co</div>
        </div>
      </div>
    </a>
    <a href="market.html">
      <div class="card">
        <div class="card-icon market">📊</div>
        <div>
          <h2>珠宝市场看板</h2>
          <div class="desc">TikTok 珠宝爆款分析 · 国家分布 · 品类排行 · 内容形式 · 互动率</div>
          <div class="tag">实时更新</div>
        </div>
      </div>
    </a>
  </div>

  <div class="ft">自动采集 · GitHub Pages</div>
</div>
</body>
</html>
