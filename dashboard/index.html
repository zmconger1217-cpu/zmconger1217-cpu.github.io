<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>运营仪表盘</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans SC','Segoe UI',-apple-system,sans-serif;background:#0d0d0d;color:#fff;padding:20px;min-height:100vh;transition:background .3s}

/* ===== 头部导航 ===== */
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:10px}
.header-left{display:flex;align-items:center;gap:14px}
.header-left h1{font-size:20px;font-weight:300;letter-spacing:.5px}
.meta{font-size:11px;color:#555}
.mode-toggle{display:flex;gap:0;background:#141414;border-radius:8px;border:1px solid #222;overflow:hidden}
.mode-btn{padding:6px 16px;font-size:12px;border:none;background:transparent;color:#666;cursor:pointer;transition:all .2s}
.mode-btn.active{background:#ffc832;color:#0d0d0d;font-weight:500}
.mode-btn:not(.active):hover{color:#aaa}
.btn-refresh{background:transparent;border:1px solid #333;color:#666;padding:6px 14px;border-radius:8px;font-size:11px;cursor:pointer}
.btn-refresh:hover{border-color:#ffc83255;color:#ffc832}
.data-badge{font-size:10px;color:#333;padding:2px 10px;border-radius:10px;background:#111}

/* 洞察栏 */
.insight-bar{margin-bottom:16px;padding:12px 16px;background:linear-gradient(135deg,#1a1a1a,#141414);border:1px solid #ffc83215;border-radius:10px;font-size:13px;color:#ffc832;display:none;align-items:center;gap:8px}
.insight-bar.show{display:flex}

/* ===== 网格 ===== */
.grid{display:grid;gap:12px;margin-bottom:12px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:1fr 1fr}
.g1{grid-template-columns:1fr}

/* ===== 卡片 ===== */
.card{background:#141414;border-radius:10px;padding:16px;border:1px solid #1e1e1e;transition:all .3s}
.card:hover{border-color:#2a2a2a}
.card .lbl{font-size:11px;color:#555;margin-bottom:4px;display:flex;align-items:center;gap:5px}
.card .num{font-size:26px;font-weight:200;color:#ffc832;font-family:Outfit,sans-serif;letter-spacing:-.5px;line-height:1.1}
.card .num .unit{font-size:13px;color:#444;font-weight:400;margin-left:2px}
.card .chg{font-size:10px;margin-left:6px;padding:1px 6px;border-radius:8px;display:inline-block;vertical-align:middle}
.card .chg.up{color:#4caf50;background:#4caf5012}
.card .chg.down{color:#ef5350;background:#ef535012}
.card .sub{font-size:10px;color:#3a3a3a;margin-top:1px}
.card h3{font-size:12px;font-weight:400;color:#555;margin-bottom:10px;display:flex;align-items:center;gap:6px}

/* ===== 图表容器 ===== */
.chart-box{width:100%;height:380px}
.chart-box-sm{width:100%;height:260px}

/* ===== 表格 ===== */
.tbl-wrap{overflow-x:auto;border-radius:6px}
table{width:100%;border-collapse:collapse;font-size:11px;min-width:600px}
thead th{background:#111;color:#666;padding:8px 10px;text-align:left;font-weight:400;font-size:10px;white-space:nowrap;border-bottom:1px solid #1a1a1a}
tbody td{padding:7px 10px;border-bottom:1px solid #181818;color:#bbb;white-space:nowrap}
tbody tr:hover td{background:#1a1a1a}
.tbl-title{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block}
.rank-num{display:inline-block;width:18px;height:18px;line-height:18px;text-align:center;border-radius:3px;font-size:10px;font-weight:500}
.rank-1{background:#ffc832;color:#1a1a1a}.rank-2{background:#ffa726;color:#1a1a1a}.rank-3{background:#ff8a65;color:#1a1a1a}
.rank-other{background:#1a1a1a;color:#555}
.tag-pill{display:inline-block;font-size:9px;padding:1px 6px;border-radius:8px;background:#1a1a1a;color:#666;margin:1px}
.tag-pill.hot{background:#ffc83210;color:#ffc832}
.highlight{color:#ffc832}
.footer{text-align:center;padding:16px 0 4px;font-size:10px;color:#181818}

/* ===== Boss 模式 ===== */
body.boss-mode{background:#000;padding:30px}
.boss-mode .header h1{font-size:28px}
.boss-mode .meta{font-size:16px;color:#777}
.boss-mode .card{background:linear-gradient(145deg,#0d0d0d,#111);border-color:#222;padding:24px;border-radius:14px}
.boss-mode .card .lbl{font-size:16px;color:#888}
.boss-mode .card .num{font-size:48px;font-weight:100;letter-spacing:-1px}
.boss-mode .card .chg{font-size:14px;padding:2px 12px;border-radius:12px}
.boss-mode .card .sub{font-size:13px;color:#555}
.boss-mode .card h3{font-size:16px;color:#777}
.boss-mode .tbl-wrap{display:none}
.boss-mode .chart-box{height:480px}
.boss-mode .chart-box-sm{height:320px}
.boss-mode .footer{font-size:12px;color:#222}
.boss-mode .insight-bar{padding:16px 20px;font-size:16px;background:linear-gradient(135deg,#1a1a1a,#0d0d0d);border-color:#ffc83222}
.boss-mode .mode-btn{padding:8px 20px;font-size:14px}
.boss-mode .g4 .card .num{font-size:56px}

/* ===== 响应式 ===== */
@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}}
@media(max-width:640px){
  body{padding:12px}
  .g4,.g3,.g2{grid-template-columns:1fr}
  .header h1{font-size:16px}
  body.boss-mode{padding:16px}
  .boss-mode .header h1{font-size:20px}
  .boss-mode .card .num{font-size:32px}
  .boss-mode .g4 .card .num{font-size:36px}
  .card{padding:12px}
  .card .num{font-size:20px}
  .chart-box,.chart-box-sm{height:220px}
  .boss-mode .chart-box{height:300px}
  .mode-toggle{width:100%}
  .mode-btn{flex:1;text-align:center}
}
</style>
</head>
<body>

<!-- ===== 顶部 ===== -->
<div class="header">
  <div class="header-left">
    <h1 id="pageTitle">📊 运营仪表盘</h1>
    <span class="data-badge">● 近7天</span>
  </div>
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <div class="meta" id="updateTime">--</div>
    <div class="mode-toggle">
      <button class="mode-btn active" onclick="setMode('ops')" id="btnOps">👥 运营</button>
      <button class="mode-btn" onclick="setMode('boss')" id="btnBoss">👑 老板</button>
    </div>
  </div>
</div>

<!-- ===== 今日洞察 ===== -->
<div class="insight-bar" id="insightBar">💡 <span id="insightText"></span></div>

<!-- ===== KPI ===== -->
<div class="grid g4" id="kpiCards"></div>

<!-- ===== 趋势 + 品类 ===== -->
<div class="grid g2">
  <div class="card"><h3>📈 播放趋势</h3><div class="chart-box" id="chartTrend"></div></div>
  <div class="card"><h3>🥧 品类分布</h3><div class="chart-box" id="chartPie"></div></div>
</div>

<!-- ===== 散点 + 排行 ===== -->
<div class="grid g2">
  <div class="card"><h3>🎯 粉丝 vs 播放</h3><div class="chart-box" id="chartScatter"></div></div>
  <div class="card"><h3>🏆 策略排行</h3><div class="chart-box-sm" id="chartRank"></div></div>
</div>

<!-- ===== 爆款明细表 ===== -->
<div class="card">
  <h3>📋 爆款明细</h3>
  <div class="tbl-wrap" id="detailTable"></div>
</div>

<div class="footer">自动采集 · GitHub Pages · ECharts</div>

<script>
// ===== 模式切换 =====
let currentMode = 'ops'

function setMode(m) {
  currentMode = m
  document.body.classList.toggle('boss-mode', m === 'boss')
  document.getElementById('btnOps').classList.toggle('active', m === 'ops')
  document.getElementById('btnBoss').classList.toggle('active', m === 'boss')
  document.getElementById('pageTitle').textContent = m === 'boss' ? '👑 运营汇报' : '📊 运营仪表盘'
  // 刷新图表尺寸
  setTimeout(() => {
    echarts.getInstanceByDom(document.getElementById('chartTrend'))?.resize()
    echarts.getInstanceByDom(document.getElementById('chartPie'))?.resize()
    echarts.getInstanceByDom(document.getElementById('chartScatter'))?.resize()
    echarts.getInstanceByDom(document.getElementById('chartRank'))?.resize()
  }, 300)
}

// ===== 加载数据 =====
fetch('data.json?' + Date.now())
  .then(r => r.json())
  .then(d => {
    document.getElementById('updateTime').textContent = '更新: ' + (d.updatedAt || '--')
    renderKPI(d.kpi)
    if (d.insights && d.insights.length) showInsight(d.insights[0])
    if (d.trend)   renderTrend(d.trend)
    if (d.pie)     renderPie(d.pie)
    if (d.scatter) renderScatter(d.scatter)
    if (d.rank)    renderRank(d.rank)
    if (d.details) renderTable(d.details)
  })
  .catch(() => {
    document.getElementById('updateTime').textContent = '⚠️ 加载失败 · 显示示例'
    loadDemo()
  })

// ===== KPI =====
function renderKPI(kpi) {
  const el = document.getElementById('kpiCards')
  el.innerHTML = ''
  ;(kpi||[]).forEach(i => {
    const chgClass = i.chg ? (i.chg[0] === '+' || i.chg[0] === '↑' ? 'up' : 'down') : ''
    const chgHtml = i.chg ? `<span class="chg ${chgClass}">${i.chg}</span>` : ''
    el.innerHTML += `<div class="card"><div class="lbl">${i.label}</div><div class="num">${i.value}${i.unit?' <span class=unit>'+i.unit+'</span>':''} ${chgHtml}</div><div class="sub">${i.sub||''}</div></div>`
  })
}

function showInsight(insight) {
  const bar = document.getElementById('insightBar')
  const txt = document.getElementById('insightText')
  bar.classList.add('show')
  txt.textContent = insight.text || ''
}

// ===== 图表 =====
function renderTrend(t) {
  const c = echarts.init(document.getElementById('chartTrend'))
  c.setOption({
    tooltip: { trigger:'axis', valueFormatter:v=>v.toLocaleString() },
    grid: { left:48, right:12, top:16, bottom:20 },
    xAxis: { type:'category', data:t.labels, axisLabel:{color:'#555',fontSize:10} },
    yAxis: { type:'value', splitLine:{lineStyle:{color:'#181818'}}, axisLabel:{color:'#555'} },
    series: [{
      type:'line', data:t.values, smooth:true, symbol:'circle', symbolSize:5,
      lineStyle:{color:'#ffc832',width:2},
      areaStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,
        colorStops:[{offset:0,color:'#ffc83222'},{offset:1,color:'#ffc83200'}]}},
      itemStyle:{color:'#ffc832'},
      markLine:{data:[{type:'average',name:'均值'}],lineStyle:{color:'#333',type:'dashed'},label:{color:'#555'}}
    }]
  })
  addResize(c)
}

function renderPie(p) {
  const c = echarts.init(document.getElementById('chartPie'))
  c.setOption({
    tooltip:{trigger:'item'},
    series:[{
      type:'pie', radius:['28%','60%'], center:['50%','48%'],
      data:p.data || (p.labels||[]).map((n,i)=>({name:n,value:(p.values||[])[i]||0})),
      label:{color:'#666',fontSize:10},
      labelLine:{lineStyle:{color:'#222'}},
      color:['#ffc832','#ff8a65','#4fc3f7','#81c784','#ba68c8','#e57373','#90a4ae'],
      emphasis:{scale:false}
    }]
  })
  addResize(c)
}

function renderScatter(s) {
  const c = echarts.init(document.getElementById('chartScatter'))
  const data = (s.data||[]).map(d => [d.fans||0, d.views||0, d.title||'', d.url||''])
  c.setOption({
    tooltip:{
      formatter:p=>`<b>${p.data[2]||'--'}</b><br/>粉丝: ${p.data[0]}<br/>播放: ${(p.data[1]/10000).toFixed(1)}万${p.data[3]?'<br/><a href="'+p.data[3]+'" target="_blank" style="color:#ffc832">🔗 查看</a>':''}`
    },
    grid:{left:50,right:12,top:12,bottom:36},
    xAxis:{type:'value',name:'粉丝',nameTextStyle:{color:'#555',fontSize:10},splitLine:{lineStyle:{color:'#181818'}},axisLabel:{color:'#555',fontSize:10}},
    yAxis:{type:'value',name:'播放(万)',nameTextStyle:{color:'#555',fontSize:10},splitLine:{lineStyle:{color:'#181818'}},axisLabel:{color:'#555',fontSize:10,formatter:v=>(v/10000).toFixed(0)}},
    series:[{type:'scatter',symbolSize:10,data,itemStyle:{color:'#ffc832',opacity:.7}}]
  })
  addResize(c)
}

function renderRank(r) {
  const c = echarts.init(document.getElementById('chartRank'))
  c.setOption({
    tooltip:{trigger:'axis',axisPointer:{type:'shadow'}},
    grid:{left:80,right:20,top:6,bottom:16},
    xAxis:{type:'value',splitLine:{lineStyle:{color:'#181818'}},axisLabel:{color:'#555'}},
    yAxis:{type:'category',data:(r.labels||[]).slice().reverse(),axisLabel:{color:'#666',fontSize:10}},
    series:[{
      type:'bar', data:(r.values||[]).slice().reverse(),
      barWidth:10, borderRadius:[0,3,3,0],
      itemStyle:{color:{type:'linear',x:0,y:0,x2:1,y2:0,colorStops:[{offset:0,color:'#ffc832'},{offset:1,color:'#ffa000'}]}},
      label:{show:true,position:'right',color:'#888',fontSize:9,formatter:'{c}'}
    }]
  })
  addResize(c)
}

// ===== 表格 =====
function renderTable(d) {
  const el = document.getElementById('detailTable')
  if (!d||!d.length) { el.innerHTML='<div style="padding:16px;color:#444;text-align:center">暂无数据</div>'; return }
  let h='<table><thead><tr><th>#</th><th>标题</th><th>粉丝</th><th>播放</th><th>点赞</th><th>标签</th><th>爆款因子</th></tr></thead><tbody>'
  d.forEach((v,i)=>{
    const rn=i<3?'rank-'+(i+1):'rank-other'
    const tags=(v.tags||[]).map(t=>`<span class="tag-pill${t.hot?' hot':''}">${t.name||t}</span>`).join('')
    const link=v.url?`href="${v.url}" target="_blank" rel="noopener"`:''
    const title=link?`<a ${link} style="color:#ffc832;text-decoration:none" title="${v.title||''}"><span class="tbl-title">${v.title||'--'}</span> ↗</a>`:`<span class="tbl-title">${v.title||'--'}</span>`
    h+=`<tr><td><span class="rank-num ${rn}">${i+1}</span></td><td>${title}</td><td>${v.fans||'--'}</td><td class="highlight">${(v.views||0).toLocaleString()}</td><td>${(v.likes||0).toLocaleString()}</td><td>${tags||'--'}</td><td style="color:#777;font-size:10px">${v.factor||'--'}</td></tr>`
  })
  h+='</tbody></table>'
  el.innerHTML=h
}

function addResize(c) { window.addEventListener('resize',()=>c.resize()) }

// ===== 示例数据 =====
function loadDemo() {
  renderKPI([
    {label:'总播放',value:'7.79M',sub:'10条爆款',chg:'+12.3%'},
    {label:'总粉丝',value:'35.2K',sub:'10个账号',chg:'+184%'},
    {label:'爆款率',value:'18%',sub:'高于均值6%',chg:'+6%'},
    {label:'平均播放',value:'779K',sub:'单条最高520K',chg:''}
  ])
  renderTrend({labels:['6/17','6/18','6/19','6/20','6/21','6/22','6/23'],values:[674,1355,2100,980,1650,810,2200]})
  renderPie({labels:['新奇特','情感共鸣','解压治愈','手工过程','痛点喜剧','升级改造'],values:[28,22,18,15,10,7]})
  renderRank({labels:['新奇特','情感共鸣','解压治愈','手工过程','痛点喜剧','升级改造'],values:[95,82,68,55,38,25]})
  renderScatter({data:[{fans:350,views:520000,title:'神奇开箱'},{fans:180,views:380000,title:'手工'},{fans:800,views:290000,title:'情感'},{fans:120,views:410000,title:'解压'},{fans:2000,views:210000,title:'教程'},{fans:50,views:670000,title:'新奇'}]})
  document.getElementById('updateTime').textContent = '更新: 示例数据'
  document.getElementById('insightBar').classList.add('show')
  document.getElementById('insightText').textContent = '新奇特品类持续走强，建议加大投入'
}
</script>
</body>
</html>
