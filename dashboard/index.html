<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>运营数据看板</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Noto Sans SC','Segoe UI',sans-serif;background:#0b0b0b;color:#eee;min-height:100vh}
a{color:#ffc832;text-decoration:none}
a:hover{opacity:.8}

/* ===== Header ===== */
.header{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;border-bottom:1px solid #151515;flex-wrap:wrap;gap:8px}
.header-left{display:flex;align-items:center;gap:12px}
.header-left h1{font-size:17px;font-weight:500;letter-spacing:.3px}
.header-left h1 span{color:#ffc832;font-weight:300}
.badge-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#4caf50;margin-right:4px}
.status{font-size:11px;color:#3a3a3a;display:flex;align-items:center;gap:4px}
.meta{font-size:11px;color:#333}
.meta span{color:#555}
.btn-github{font-size:10px;color:#333;border:1px solid #1a1a1a;padding:4px 10px;border-radius:6px}
.btn-github:hover{border-color:#ffc83233;color:#ffc832}

/* ===== Layout ===== */
.wrap{max-width:1440px;margin:0 auto;padding:18px 24px}
.grid{display:grid;gap:12px;margin-bottom:12px}
.g4{grid-template-columns:repeat(4,1fr)}
.g2{grid-template-columns:1fr 1fr}
.g1{grid-template-columns:1fr}

/* ===== Insight Bar ===== */
.insight{margin-bottom:16px;padding:14px 18px;background:linear-gradient(135deg,#111,#0d0d0d);border:1px solid #ffc8320c;border-radius:10px;display:none;align-items:flex-start;gap:10px;font-size:13px;color:#ccc}
.insight.show{display:flex}
.insight .icon{font-size:16px;flex-shrink:0;margin-top:1px}
.insight .text{line-height:1.5}
.insight .text strong{color:#ffc832;font-weight:500}

/* ===== Cards ===== */
.card{background:#111;border-radius:10px;padding:18px;border:1px solid #181818;transition:border-color .2s,background .2s}
.card:hover{background:#141414;border-color:#222}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:2px}
.card-label{font-size:11px;color:#444;text-transform:uppercase;letter-spacing:.5px}
.card-val{font-size:28px;font-weight:300;color:#ffc832;font-family:Outfit,-apple-system,sans-serif;letter-spacing:-.3px;line-height:1.2}
.card-chg{font-size:10px;padding:1px 7px;border-radius:6px;display:inline-block;vertical-align:middle;margin-left:6px;font-weight:400}
.card-chg.up{color:#4caf50;background:#4caf500d}
.card-chg.down{color:#ef5350;background:#ef53500d}
.card-sub{font-size:10px;color:#2a2a2a;margin-top:0}

/* ===== Chart Cards ===== */
.chart-card{background:#111;border-radius:10px;padding:18px;border:1px solid #181818}
.chart-card:hover{border-color:#222}
.chart-card h3{font-size:12px;font-weight:400;color:#555;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.chart-box{width:100%;height:380px}
.chart-box-sm{width:100%;height:280px}

/* ===== Table ===== */
.tbl-wrap{overflow-x:auto;border-radius:6px;background:#111;border:1px solid #181818}
table{width:100%;border-collapse:collapse;font-size:11px;min-width:680px}
thead th{color:#444;padding:10px 12px;text-align:left;font-weight:400;font-size:10px;border-bottom:1px solid #181818;text-transform:uppercase;letter-spacing:.5px}
thead th.sorted{color:#888}
tbody td{padding:9px 12px;border-bottom:1px solid #111;color:#aaa;white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#151515}
.tbl-title{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;color:#ccc}
.tbl-title:hover{color:#ffc832}
.rank-num{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:4px;font-size:10px;font-weight:500}
.rank-1{background:#ffc83215;color:#ffc832}.rank-2{background:#ffa72615;color:#ffa726}.rank-3{background:#ff8a6515;color:#ff8a65}
.rank-other{background:#181818;color:#555}
.tag{display:inline-block;font-size:9px;padding:2px 7px;border-radius:6px;background:#181818;color:#555;margin:1px}
.tag.hot{background:#ffc8320a;color:#ffc832}
.highlight{color:#ffc832}
.num-col{text-align:right;font-variant-numeric:tabular-nums}
.num-col .small{font-size:9px;color:#444;margin-left:3px}

/* ===== Footer ===== */
.footer{text-align:center;padding:20px 0 8px;font-size:10px;color:#181818}

/* ===== Loading ===== */
.loading{display:flex;align-items:center;justify-content:center;min-height:400px;color:#333;font-size:13px;gap:8px}
.spinner{width:16px;height:16px;border:2px solid #181818;border-top-color:#ffc83233;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== Responsive ===== */
@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){
  .wrap{padding:12px 14px}
  .header{padding:12px 14px}
  .g4,.g2{grid-template-columns:1fr}
  .card-val{font-size:22px}
  .chart-box,.chart-box-sm{height:220px}
  .insight{font-size:12px;padding:12px}
}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1><span>◈</span> 运营看板</h1>
    <span class="status"><span class="badge-dot"></span>近7天</span>
  </div>
  <div class="meta"><span id="updateTime">加载中...</span></div>
</div>

<div class="wrap">

  <!-- 洞察栏 -->
  <div class="insight" id="insightBar">
    <span class="icon">💡</span>
    <div class="text" id="insightText"></div>
  </div>

  <!-- KPI -->
  <div class="grid g4" id="kpiCards"></div>

  <!-- 趋势 + 品类 -->
  <div class="grid g2">
    <div class="chart-card"><h3>📈 播放趋势</h3><div class="chart-box" id="chartTrend"></div></div>
    <div class="chart-card"><h3>🥧 品类分布</h3><div class="chart-box" id="chartPie"></div></div>
  </div>

  <!-- 散点 + 排行 -->
  <div class="grid g2">
    <div class="chart-card"><h3>🎯 粉丝 vs 播放</h3><div class="chart-box" id="chartScatter"></div></div>
    <div class="chart-card"><h3>🏆 策略评分</h3><div class="chart-box-sm" id="chartRank"></div></div>
  </div>

  <!-- 爆款明细表 -->
  <div class="tbl-wrap" id="detailTable"></div>

</div>

<div class="footer">TikTok 数据分析 · 每日更新</div>

<script>
const C = echarts.init.bind(echarts)

// ===== 加载 =====
fetch('data.json?'+Date.now()).then(r=>r.json()).then(d=>{
  document.getElementById('updateTime').textContent='更新 '+d.updatedAt
  renderKPI(d.kpi)
  renderInsight(d.insights)
  if(d.trend)   renderTrend(d.trend)
  if(d.pie)     renderPie(d.pie)
  if(d.scatter) renderScatter(d.scatter)
  if(d.rank)    renderRank(d.rank)
  if(d.details) renderTable(d.details)
}).catch(()=>{
  document.getElementById('updateTime').textContent='⚠️ 加载失败'
  loadDemo()
})

// ===== KPI =====
function renderKPI(arr){
  const el=document.getElementById('kpiCards')
  el.innerHTML=''
  ;(arr||[]).forEach(i=>{
    const c=i.chg?(i.chg[0]=='+'||i.chg[0]=='↑'?'up':'down'):''
    el.innerHTML+=`<div class="card"><div class="card-top"><span class="card-label">${i.label}</span></div>
      <div class="card-val">${i.value}${i.chg?`<span class="card-chg ${c}">${i.chg}</span>`:''}</div>
      <div class="card-sub">${i.sub||''}</div></div>`
  })
}

function renderInsight(arr){
  if(!arr||!arr.length) return
  const bar=document.getElementById('insightBar'),txt=document.getElementById('insightText')
  bar.classList.add('show')
  txt.innerHTML=arr.map(i=>`<strong>${i.type==='alert'?'⚠️':'💡'}</strong> ${i.text}`).join('<br>')
}

// ===== 图表 =====
function renderTrend(t){
  const c=C(document.getElementById('chartTrend'))
  c.setOption({
    tooltip:{trigger:'axis',valueFormatter:v=>v.toLocaleString()},
    grid:{left:44,right:10,top:14,bottom:18},
    xAxis:{type:'category',data:t.labels,axisLabel:{color:'#444',fontSize:10}},
    yAxis:{type:'value',splitLine:{lineStyle:{color:'#151515'}},axisLabel:{color:'#444'}},
    series:[{
      type:'line',data:t.values,smooth:true,symbol:'circle',symbolSize:5,
      lineStyle:{color:'#ffc832',width:2},
      areaStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:'#ffc83218'},{offset:1,color:'#ffc83200'}]}},
      itemStyle:{color:'#ffc832'},
      markLine:{data:[{type:'average',name:'日均'}],lineStyle:{color:'#2a2a2a',type:'dashed',width:1},label:{color:'#444',fontSize:10,formatter:'均 {c}'}}
    }]
  })
  w(c)
}

function renderPie(p){
  const c=C(document.getElementById('chartPie'))
  c.setOption({
    tooltip:{trigger:'item'},
    series:[{
      type:'pie',radius:['30%','60%'],center:['50%','48%'],
      data:p.data||(p.labels||[]).map((n,i)=>({name:n,value:(p.values||[])[i]||0})),
      label:{color:'#555',fontSize:10},labelLine:{lineStyle:{color:'#222'}},
      color:['#ffc832','#ff8a65','#4fc3f7','#81c784','#ba68c8','#e57373','#90a4ae'],
      emphasis:{scale:false}
    }]
  })
  w(c)
}

function renderScatter(s){
  const c=C(document.getElementById('chartScatter'))
  const d=(s.data||[]).map(v=>[v.fans||0,v.views||0,v.title||'',v.url||''])
  c.setOption({
    tooltip:{formatter:p=>`<b>${p.data[2]||'--'}</b><br/>粉丝 ${p.data[0]}<br/>播放 ${(p.data[1]/10000).toFixed(1)}万${p.data[3]?'<br/><a href="'+p.data[3]+'" style="color:#ffc832">🔗 查看视频</a>':''}`},
    grid:{left:44,right:10,top:10,bottom:34},
    xAxis:{type:'value',name:'粉丝',nameTextStyle:{color:'#444',fontSize:10},splitLine:{lineStyle:{color:'#151515'}},axisLabel:{color:'#444',fontSize:10}},
    yAxis:{type:'value',name:'播放(万)',nameTextStyle:{color:'#444',fontSize:10},splitLine:{lineStyle:{color:'#151515'}},axisLabel:{color:'#444',fontSize:10,formatter:v=>(v/10000).toFixed(0)}},
    series:[{type:'scatter',symbolSize:10,data:d,itemStyle:{color:'#ffc832',opacity:.65}}]
  })
  w(c)
}

function renderRank(r){
  const c=C(document.getElementById('chartRank'))
  c.setOption({
    tooltip:{trigger:'axis',axisPointer:{type:'shadow'}},
    grid:{left:76,right:18,top:6,bottom:14},
    xAxis:{type:'value',splitLine:{lineStyle:{color:'#151515'}},axisLabel:{color:'#444'}},
    yAxis:{type:'category',data:(r.labels||[]).slice().reverse(),axisLabel:{color:'#555',fontSize:10}},
    series:[{
      type:'bar',data:(r.values||[]).slice().reverse(),barWidth:10,borderRadius:[0,3,3,0],
      itemStyle:{color:{type:'linear',x:0,y:0,x2:1,y2:0,colorStops:[{offset:0,color:'#f5b342'},{offset:1,color:'#ffc832'}]}},
      label:{show:true,position:'right',color:'#888',fontSize:9,formatter:'{c}'}
    }]
  })
  w(c)
}

// ===== 表格 =====
function renderTable(d){
  const el=document.getElementById('detailTable')
  if(!d||!d.length){el.innerHTML='<div style="padding:24px;color:#333;text-align:center">暂无数据</div>';return}
  let h='<table><thead><tr><th style="width:32px">#</th><th>标题</th><th class="num-col">粉丝</th><th class="num-col">播放</th><th class="num-col">点赞</th><th>标签</th><th>爆款因子</th></tr></thead><tbody>'
  d.forEach((v,i)=>{
    const r=i<3?'rank-'+(i+1):'rank-other'
    const tags=(v.tags||[]).map(t=>`<span class="tag${t.hot?' hot':''}">${t.name||t}</span>`).join('')
    const link=v.url?`href="${v.url}" target="_blank"`:''
    const title=link?`<a ${link} title="${v.title||''}"><span class="tbl-title">${v.title||'--'}</span> ↗</a>`:`<span class="tbl-title">${v.title||'--'}</span>`
    const fm=n=>n.toLocaleString()
    h+=`<tr><td><span class="rank-num ${r}">${i+1}</span></td>
      <td>${title}</td>
      <td class="num-col">${fm(v.fans||0)}</td>
      <td class="num-col highlight">${fm(v.views||0)}</td>
      <td class="num-col">${fm(v.likes||0)}</td>
      <td>${tags||'--'}</td>
      <td style="color:#666;font-size:10px">${v.factor||'--'}</td></tr>`
  })
  h+='</tbody></table>'
  el.innerHTML=h
}

function w(c){window.addEventListener('resize',()=>c.resize())}

// ===== 示例 =====
function loadDemo(){
  renderKPI([
    {label:'总播放',value:'7.79M',sub:'10条爆款',chg:'+12.3%'},
    {label:'总粉丝',value:'35.2K',sub:'10个账号',chg:'+184%'},
    {label:'爆款率',value:'18%',sub:'高于均值6%',chg:'+6%'},
    {label:'平均播放',value:'779K',sub:'单条最高520K',chg:''}
  ])
  renderInsight([{type:'trend_up',text:'新奇特品类持续走强，建议加大投入'}])
  renderTrend({labels:['6/17','6/18','6/19','6/20','6/21','6/22','6/23'],values:[674,1355,2100,980,1650,810,2200]})
  renderPie({labels:['新奇特','情感共鸣','解压治愈','手工过程','痛点喜剧','升级改造'],values:[28,22,18,15,10,7]})
  renderRank({labels:['新奇特','情感共鸣','解压治愈','手工过程','痛点喜剧','升级改造'],values:[95,82,68,55,38,25]})
  renderScatter({data:[{fans:350,views:520000},{fans:180,views:380000},{fans:800,views:290000},{fans:120,views:410000},{fans:2000,views:210000},{fans:50,views:670000}]})
  document.getElementById('updateTime').textContent='更新 示例数据'
}
</script>
</body>
</html>
