<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>运营数据看板</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Noto Sans SC','Segoe UI',sans-serif;background:#0b0b0b;color:#eee;min-height:100vh}
a{color:#ffc832;text-decoration:none}

/* Header */
.header{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-bottom:1px solid #151515;flex-wrap:wrap;gap:6px}
.h-left{display:flex;align-items:center;gap:10px}
.h-left h1{font-size:16px;font-weight:500}
.h-left h1 span{color:#ffc832;font-weight:300}
.status-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#4caf50;margin-right:4px}
.status{font-size:11px;color:#333;display:flex;align-items:center;gap:4px}
.meta{font-size:11px;color:#333}
.meta b{color:#555;font-weight:400}

/* Layout */
.wrap{max-width:1440px;margin:0 auto;padding:16px 24px}
.grid{display:grid;gap:12px;margin-bottom:12px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:1fr 1fr}

/* Insight */
.insight{margin-bottom:14px;padding:12px 16px;background:linear-gradient(135deg,#111,#0d0d0d);border:1px solid #ffc8320c;border-radius:8px;display:none;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:#999;line-height:1.6}
.insight.show{display:flex}
.insight i{font-style:normal;color:#ffc832}

/* Cards */
.card{background:#111;border-radius:8px;padding:16px;border:1px solid #181818}
.card:hover{background:#141414}
.card .lbl{font-size:10px;color:#444;text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px}
.card .val{font-size:26px;font-weight:300;color:#ffc832;line-height:1.2}
.card .chg{font-size:10px;padding:1px 7px;border-radius:5px;margin-left:5px;vertical-align:middle}
.card .chg.up{color:#4caf50;background:#4caf500a}
.card .chg.down{color:#ef5350;background:#ef53500a}
.card .sub{font-size:10px;color:#2a2a2a;margin-top:1px}

/* Chart cards */
.cc{background:#111;border-radius:8px;padding:16px;border:1px solid #181818}
.cc h3{font-size:11px;font-weight:400;color:#555;margin-bottom:8px;display:flex;align-items:center;gap:5px}
.cb{width:100%;height:340px}
.cb-sm{width:100%;height:260px}

/* Table */
.tw{overflow-x:auto;border-radius:6px;background:#111;border:1px solid #181818}
table{width:100%;border-collapse:collapse;font-size:11px;min-width:760px}
th{color:#444;padding:9px 11px;text-align:left;font-weight:400;font-size:9px;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid #181818;white-space:nowrap}
td{padding:8px 11px;border-bottom:1px solid #111;color:#999;white-space:nowrap}
tr:last-child td{border-bottom:none}
tr:hover td{background:#141414}
.tbl-t{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;color:#ccc}
.tbl-t:hover{color:#ffc832}
.rn{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:3px;font-size:9px;font-weight:500}
.r1{background:#ffc83212;color:#ffc832}.r2{background:#ffa72612;color:#ffa726}.r3{background:#ff8a6512;color:#ff8a65}
.ro{background:#151515;color:#444}
.tg{display:inline-block;font-size:9px;padding:1px 6px;border-radius:5px;background:#151515;color:#555;margin:1px}
.tg.h{background:#ffc83208;color:#ffc832}
.hl{color:#ffc832}
.nc{text-align:right;font-variant-numeric:tabular-nums}

/* Footer */
.ft{text-align:center;padding:18px 0 6px;font-size:10px;color:#151515}

/* Loading */
.ld{display:flex;align-items:center;justify-content:center;min-height:300px;color:#333;font-size:12px;gap:8px}
.sp{width:14px;height:14px;border:2px solid #151515;border-top-color:#ffc83222;border-radius:50%;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}

@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){
  .wrap{padding:12px 14px}.header{padding:12px 14px}
  .g4,.g3,.g2{grid-template-columns:1fr}
  .card .val{font-size:20px}.cb,.cb-sm{height:220px}
}
</style>
</head>
<body>

<div class="header">
  <div class="h-left">
    <h1><span>◆</span> 运营看板</h1>
    <span class="status"><span class="status-dot"></span>今日</span>
  </div>
  <div class="meta"><b id="updateTime">加载中...</b></div>
</div>

<div class="wrap">

  <div class="insight" id="insightBar">
    <div id="insightText" style="display:flex;flex-wrap:wrap;gap:2px 16px"></div>
  </div>

  <div class="grid g4" id="kpiCards"></div>

  <div class="grid g2">
    <div class="cc"><h3>🌍 国家/区域分布</h3><div class="cb" id="chartGeo"></div></div>
    <div class="cc"><h3>💍 商品类型分布</h3><div class="cb" id="chartProduct"></div></div>
  </div>

  <div class="grid g2">
    <div class="cc"><h3>📈 播放趋势</h3><div class="cb" id="chartTrend"></div></div>
    <div class="cc"><h3>🎬 内容形式 · 互动率</h3><div class="cb" id="chartContent"></div></div>
  </div>

  <div class="grid g2">
    <div class="cc"><h3>🎯 粉丝 vs 播放</h3><div class="cb" id="chartScatter"></div></div>
    <div class="cc"><h3>🏆 策略评分</h3><div class="cb-sm" id="chartRank"></div></div>
  </div>

  <div class="tw" id="detailTable"></div>

</div>

<div class="ft">TikTok 数据分析 · 每日自动更新</div>

<script>
function E(id){return echarts.init(document.getElementById(id))}
function R(c){window.addEventListener('resize',()=>c.resize())}
function F(n){return (n||0).toLocaleString()}

fetch('data.json?'+Date.now()).then(r=>r.json()).then(d=>{
  document.getElementById('updateTime').textContent='更新 '+d.updatedAt
  renderKPI(d.kpi)
  renderInsight(d.insights)
  if(d.geo)         renderGeo(d.geo)
  if(d.pie)         renderProduct(d.pie)
  if(d.trend)       renderTrend(d.trend)
  if(d.content_formats) renderContent(d.content_formats)
  if(d.scatter)     renderScatter(d.scatter)
  if(d.rank)        renderRank(d.rank)
  if(d.details)     renderTable(d.details)
}).catch(()=>{
  document.getElementById('updateTime').textContent='⚠️ 加载失败'
  loadDemo()
})

function renderKPI(arr){
  const el=document.getElementById('kpiCards');el.innerHTML=''
  ;(arr||[]).forEach(i=>{
    const c=i.chg?(i.chg[0]=='+'?'up':'down'):''
    el.innerHTML+=`<div class="card"><div class="lbl">${i.label}</div><div class="val">${i.value}${i.chg?`<span class="chg ${c}">${i.chg}</span>`:''}</div><div class="sub">${i.sub||''}</div></div>`
  })
}

function renderInsight(arr){
  if(!arr||!arr.length)return
  const t=document.getElementById('insightText')
  document.getElementById('insightBar').classList.add('show')
  t.innerHTML=arr.map(i=>`<i>${i.text}</i>`).join('')
}

function renderGeo(g){
  const c=E('chartGeo')
  const data=(g.labels||[]).map((n,i)=>({name:n,value:(g.values||[])[i]||0}))
  c.setOption({
    tooltip:{trigger:'item',formatter:'{b}: {c}%'},
    grid:{left:80,right:20,top:6,bottom:16},
    xAxis:{type:'value',splitLine:{lineStyle:{color:'#151515'}},axisLabel:{color:'#444',fontSize:9,formatter:'{value}%'}},
    yAxis:{type:'category',data:(g.labels||[]).slice().reverse(),axisLabel:{color:'#666',fontSize:10}},
    series:[{
      type:'bar',data:(g.values||[]).slice().reverse(),barWidth:14,borderRadius:[0,4,4,0],
      itemStyle:{color:{type:'linear',x:0,y:0,x2:1,y2:0,colorStops:[{offset:0,color:'#ffc832'},{offset:1,color:'#f5b342'}]}},
      label:{show:true,position:'right',color:'#888',fontSize:9,formatter:'{c}%'}
    }]
  });R(c)
}

function renderProduct(p){
  const c=E('chartProduct')
  c.setOption({
    tooltip:{trigger:'item',formatter:'{b}: {c}%'},
    series:[{
      type:'pie',radius:['28%','58%'],center:['50%','48%'],
      data:p.data||(p.labels||[]).map((n,i)=>({name:n,value:(p.values||[])[i]||0})),
      label:{color:'#555',fontSize:9},labelLine:{lineStyle:{color:'#222'}},
      color:['#ffc832','#ff8a65','#4fc3f7','#81c784','#ba68c8','#e57373','#90a4ae'],
      emphasis:{scale:false}
    }]
  });R(c)
}

function renderTrend(t){
  const c=E('chartTrend')
  c.setOption({
    tooltip:{trigger:'axis',valueFormatter:v=>v.toLocaleString()},
    grid:{left:42,right:10,top:12,bottom:16},
    xAxis:{type:'category',data:t.labels,axisLabel:{color:'#444',fontSize:9}},
    yAxis:{type:'value',splitLine:{lineStyle:{color:'#151515'}},axisLabel:{color:'#444'}},
    series:[{
      type:'line',data:t.values,smooth:true,symbol:'circle',symbolSize:4,
      lineStyle:{color:'#ffc832',width:2},
      areaStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:'#ffc83215'},{offset:1,color:'#ffc83200'}]}},
      itemStyle:{color:'#ffc832'},
      markLine:{data:[{type:'average',name:'均'}],lineStyle:{color:'#2a2a2a',type:'dashed'},label:{color:'#444',fontSize:9,formatter:'均 {c}'}}
    }]
  });R(c)
}

function renderContent(f){
  const c=E('chartContent')
  const labels=(f.labels||[]).slice()
  const er=(f.er||[]).slice()
  const plays=(f.avg_plays||[]).slice()
  c.setOption({
    tooltip:{trigger:'axis'},
    legend:{data:['互动率%','均播放'],textStyle:{color:'#555',fontSize:9},top:-2,right:0},
    grid:{left:56,right:36,top:24,bottom:16},
    xAxis:{type:'category',data:labels,axisLabel:{color:'#444',fontSize:8,rotate:15}},
    yAxis:[
      {type:'value',name:'互动率%',nameTextStyle:{color:'#444',fontSize:9},splitLine:{lineStyle:{color:'#151515'}},axisLabel:{color:'#444',fontSize:8}},
      {type:'value',name:'均播放',nameTextStyle:{color:'#444',fontSize:9},splitLine:{show:false},axisLabel:{color:'#444',fontSize:8,formatter:v=>v>=10000?(v/10000).toFixed(0)+'万':v}}
    ],
    series:[
      {type:'bar',data:er,barWidth:12,borderRadius:[3,3,0,0],itemStyle:{color:'#ffc832'},label:{show:true,position:'top',color:'#888',fontSize:8,formatter:'{c}%'}},
      {type:'line',data:plays,smooth:true,symbol:'diamond',symbolSize:6,lineStyle:{color:'#4fc3f7',width:1.5},itemStyle:{color:'#4fc3f7'},yAxisIndex:1,
       label:{show:true,position:'bottom',color:'#888',fontSize:7,formatter:v=>v>=10000?(v/10000).toFixed(0)+'万':v}}
    ]
  });R(c)
}

function renderScatter(s){
  const c=E('chartScatter')
  const d=(s.data||[]).map(v=>[v.fans||0,v.views||0,v.title||'',v.url||''])
  c.setOption({
    tooltip:{formatter:p=>`<b>${p.data[2]||'--'}</b><br/>粉丝 ${p.data[0]}<br/>播放 ${(p.data[1]/10000).toFixed(1)}万${p.data[3]?'<br/><a href="'+p.data[3]+'" style="color:#ffc832">🔗 查看</a>':''}`},
    grid:{left:42,right:10,top:8,bottom:32},
    xAxis:{type:'value',name:'粉丝',nameTextStyle:{color:'#444',fontSize:9},splitLine:{lineStyle:{color:'#151515'}},axisLabel:{color:'#444',fontSize:9}},
    yAxis:{type:'value',name:'播放(万)',nameTextStyle:{color:'#444',fontSize:9},splitLine:{lineStyle:{color:'#151515'}},axisLabel:{color:'#444',fontSize:9,formatter:v=>(v/10000).toFixed(0)}},
    series:[{type:'scatter',symbolSize:9,data:d,itemStyle:{color:'#ffc832',opacity:.6}}]
  });R(c)
}

function renderRank(r){
  const c=E('chartRank')
  c.setOption({
    tooltip:{trigger:'axis',axisPointer:{type:'shadow'}},
    grid:{left:70,right:16,top:4,bottom:12},
    xAxis:{type:'value',splitLine:{lineStyle:{color:'#151515'}},axisLabel:{color:'#444'}},
    yAxis:{type:'category',data:(r.labels||[]).slice().reverse(),axisLabel:{color:'#555',fontSize:9}},
    series:[{
      type:'bar',data:(r.values||[]).slice().reverse(),barWidth:10,borderRadius:[0,3,3,0],
      itemStyle:{color:{type:'linear',x:0,y:0,x2:1,y2:0,colorStops:[{offset:0,color:'#f5b342'},{offset:1,color:'#ffc832'}]}},
      label:{show:true,position:'right',color:'#888',fontSize:8,formatter:'{c}'}
    }]
  });R(c)
}

function renderTable(d){
  const el=document.getElementById('detailTable')
  if(!d||!d.length){el.innerHTML='<div style="padding:20px;color:#333;text-align:center">暂无数据</div>';return}
  let h='<table><thead><tr><th style="width:26px">#</th><th>标题</th><th class="nc">播放</th><th class="nc">互动率</th><th>国家</th><th>品类</th><th>内容形式</th><th>评分</th></tr></thead><tbody>'
  d.forEach((v,i)=>{
    const r=i<3?'r'+(i+1):'ro'
    const link=v.url?`href="${v.url}" target="_blank"`:''
    const t=link?`<a ${link} title="${v.title||''}"><span class="tbl-t">${v.title||'--'}</span> ↗</a>`:`<span class="tbl-t">${v.title||'--'}</span>`
    h+=`<tr><td><span class="rn ${r}">${i+1}</span></td>
      <td>${t}</td>
      <td class="nc hl">${F(v.views)}</td>
      <td class="nc">${v.engagement_rate||'--'}</td>
      <td>${v.region||'--'}</td>
      <td>${v.product_type||'--'}</td>
      <td>${v.content_format||'--'}</td>
      <td class="nc">${v.buzz_score||'--'}</td></tr>`
  })
  h+='</tbody></table>'
  el.innerHTML=h
}

function loadDemo(){
  renderKPI([{label:'总播放',value:'7.79M',sub:'40条爆款',chg:'+12.3%'},{label:'总粉丝',value:'35.2K',sub:'均3.5K/号',chg:'+184%'},{label:'互动率',value:'8.4%',sub:'点赞+评论+分享/播放',chg:''},{label:'热力市场',value:'US/CA',sub:'占95%',chg:''}])
  renderInsight([{text:'🌍 最热市场: US/CA 占 95%'},{text:'💍 最热品类: 其他 占 42%'},{text:'🎬 最高互动: Review/Unboxing 14.7%'}])
  renderGeo({labels:['US/CA','LATAM','SEA'],values:[95,3,2]})
  renderProduct({labels:['Necklace','Ring','Bracelet','Earrings','Set'],values:[35,25,15,12,8]})
  renderTrend({labels:['6/19','6/20','6/21','6/22','6/23','6/24','6/25'],values:[1355,2100,980,1650,810,2200,1800]})
  renderContent({labels:['Other','Storytime','Tutorial','Showcase','ASMR','Review'],er:[6.2,9.8,7.5,5.1,11.2,14.7],avg_plays:[3900,2800,1500,2100,3200,4500]})
  renderRank({labels:['手工过程','其他','新奇特','情感共鸣'],values:[92,85,82,78]})
  renderScatter({data:[{fans:350,views:520000},{fans:180,views:380000},{fans:800,views:290000},{fans:120,views:410000},{fans:2000,views:210000},{fans:50,views:670000}]})
  document.getElementById('updateTime').textContent='更新 示例数据'
}
</script>
</body>
</html>
