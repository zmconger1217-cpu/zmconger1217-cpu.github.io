<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MindJewel 品牌看板</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Noto Sans SC','Segoe UI',sans-serif;background:#f8f8f8;color:#222;min-height:100vh}
a{color:#222;text-decoration:none}
.nav{display:flex;align-items:center;gap:0;background:#fff;border-bottom:1px solid #eee;padding:0 24px}
.nav a{display:flex;align-items:center;gap:6px;padding:14px 18px;font-size:12px;color:#999;border-bottom:2px solid transparent;transition:all .2s}
.nav a:hover{color:#555}
.nav a.active{color:#000;border-bottom-color:#000;background:linear-gradient(0deg,#00000006,transparent)}
.nav a span{font-size:14px}
@media(max-width:640px){.nav{padding:0 14px;overflow-x:auto}}

.header{display:flex;justify-content:space-between;align-items:center;padding:20px 24px 12px}
.h-left{display:flex;align-items:center;gap:12px}
.h-left h1{font-size:18px;font-weight:600;color:#222}
.h-left h1 span{color:#000}
.meta{font-size:11px;color:#bbb}

.wrap{max-width:1200px;margin:0 auto;padding:0 24px 24px}
.grid{display:grid;gap:12px;margin-bottom:16px}
.g4{grid-template-columns:repeat(4,1fr)}
.g2{grid-template-columns:1fr 1fr}

.brand-hero{background:#fff;border:1px solid #eee;border-radius:14px;padding:28px 32px;margin-bottom:16px}
.brand-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px}
.brand-identity{display:flex;align-items:center;gap:16px}
.brand-avatar{width:56px;height:56px;border-radius:50%;background:#222;color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:600}
.brand-name{font-size:20px;font-weight:600;color:#222}
.brand-handle{font-size:13px;color:#bbb;margin-top:2px}
.brand-bio{font-size:12px;color:#999;margin-top:4px}
.brand-link{font-size:11px;color:#bbb;margin-top:6px;display:inline-flex;align-items:center;gap:4px}
.brand-link:hover{color:#000}
.brand-metrics{display:flex;gap:28px}
.brand-metric{text-align:center}
.brand-metric .val{display:block;font-size:28px;font-weight:400;color:#000;line-height:1.2}
.brand-metric .lbl{font-size:10px;color:#bbb;text-transform:uppercase;letter-spacing:.3px;margin-top:2px}
.brand-metric .chg{font-size:10px;display:inline-block;padding:1px 6px;border-radius:4px;margin-top:2px}
.brand-metric .chg.up{color:#4caf50;background:#4caf5008}
.brand-metric .chg.down{color:#ef5350;background:#ef535008}

.status-bar{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px;padding:12px 16px;background:#fff;border-radius:8px;border:1px solid #eee;font-size:11px;color:#bbb}
.status-bar span{display:flex;align-items:center;gap:4px}
.status-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#4caf50}

.card{background:#fff;border-radius:10px;padding:16px;border:1px solid #eee}
.card .lbl{font-size:10px;color:#bbb;text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px}
.card .val{font-size:22px;font-weight:500;color:#222;line-height:1.2}
.card .sub{font-size:10px;color:#ccc;margin-top:1px}

.cc{background:#fff;border-radius:10px;padding:16px;border:1px solid #eee}
.cc h3{font-size:11px;font-weight:500;color:#666;margin-bottom:10px;display:flex;align-items:center;gap:5px}
.cb{width:100%;height:300px}

.video-section{margin-top:16px}
.video-section h3{font-size:13px;font-weight:500;color:#666;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.video-card{background:#fff;border-radius:10px;border:1px solid #eee;overflow:hidden;transition:all .2s}
.video-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.06);transform:translateY(-2px)}
.video-cover{width:100%;aspect-ratio:9/16;background:#f5f5f5;display:flex;align-items:center;justify-content:center;color:#ddd;font-size:12px;overflow:hidden;position:relative}
.video-cover img{width:100%;height:100%;object-fit:cover}
.video-cover .play-badge{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,.55);color:#fff;font-size:9px;padding:2px 7px;border-radius:4px}
.video-info{padding:8px 10px}
.video-info .vtitle{font-size:10px;color:#555;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:3px}
.video-info .vstats{display:flex;gap:8px;font-size:9px;color:#bbb}
.ft{text-align:center;padding:20px 0 6px;font-size:10px;color:#eee}

@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){
  .wrap{padding:0 14px}.nav{padding:0 14px;overflow-x:auto}
  .brand-hero{padding:18px 16px}
  .brand-top{flex-direction:column;align-items:flex-start}
  .brand-metrics{gap:16px;width:100%;justify-content:space-around}
  .brand-metric .val{font-size:22px}
  .g4,.g2{grid-template-columns:1fr}.cb{height:220px}
  .video-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<div class="nav">
  <a href="brand.html" class="active"><span>◈</span> 品牌</a>
  <a href="market.html"><span>◈</span> 市场</a>
</div>

<div class="header">
  <div class="h-left"><h1><span>◆</span> MindJewel</h1></div>
  <div class="meta"><b id="updateTime">加载中...</b></div>
</div>

<div class="wrap">

  <div class="brand-hero" id="brandHero">
    <div class="brand-top">
      <div class="brand-identity">
        <div class="brand-avatar">M</div>
        <div>
          <div class="brand-name">MindJewel</div>
          <div class="brand-handle">@mindjewel.co</div>
          <div class="brand-bio" id="brandBio"></div>
          <a class="brand-link" href="https://www.tiktok.com/@mindjewel.co" target="_blank">TikTok ↗</a>
        </div>
      </div>
      <div class="brand-metrics">
        <div class="brand-metric">
          <span class="val" id="mFollowers">--</span>
          <span class="lbl">粉丝</span>
          <span class="chg" id="mFollowersChg"></span>
        </div>
        <div class="brand-metric">
          <span class="val" id="mLikes">--</span>
          <span class="lbl">点赞</span>
          <span class="chg" id="mLikesChg"></span>
        </div>
        <div class="brand-metric">
          <span class="val" id="mFollowing">--</span>
          <span class="lbl">关注</span>
        </div>
        <div class="brand-metric">
          <span class="val" id="mGrowth">--</span>
          <span class="lbl">增长</span>
        </div>
      </div>
    </div>
  </div>

  <div class="status-bar">
    <span><span class="status-dot"></span> TikTok</span>
    <span>💎 珠宝品牌</span>
  </div>

  <div class="grid g4" id="kpiCards"></div>

  <div class="grid g2">
    <div class="cc"><h3>📈 粉丝增长</h3><div class="cb" id="chartFollowers"></div></div>
    <div class="cc"><h3>📊 品牌 vs 市场</h3><div class="cb" id="chartBenchmark"></div></div>
  </div>

  <div class="video-section">
    <h3>🎬 我的视频 TOP 10</h3>
    <div class="video-grid" id="videoGrid"></div>
    <div id="videoLoginTip" style="display:none;text-align:center;padding:24px;background:#fff;border:1px solid #eee;border-radius:10px;margin-top:10px;font-size:12px;color:#bbb;line-height:1.8">
      要查看 MindJewel 自己的视频数据 👉 登录 TikTok 后告诉我"采视频"<br>
      或者手动输入视频链接
    </div>
  </div>

</div>

<div class="ft">MindJewel 品牌监测</div>

<script>
function E(id){return echarts.init(document.getElementById(id))}
function R(c){window.addEventListener('resize',()=>c.resize())}
function F(n){return (n||0).toLocaleString()}
// 图片代理: 如果直连失败则通过 proxy 加载
function imgUrl(url){
  if(!url) return ''
  // TikTok CDN 可能需要走代理
  return url
}

Promise.all([
  fetch('data.json?'+Date.now()).then(r=>r.json()).catch(()=>null),
  fetch('mindjewel_videos.json?'+Date.now()).then(r=>r.json()).catch(()=>[])
]).then(([d, vids])=>{
  document.getElementById('updateTime').textContent='更新 '+(d?.updatedAt||'--')
  if(d?.brand) renderBrand(d.brand)
  if(d?.kpi) renderKPI(d.kpi)
  renderVideos(vids||[])
}).catch(()=>{
  document.getElementById('updateTime').textContent='示例数据'
  loadDemo()
})

function renderBrand(b){
  document.getElementById('mFollowers').textContent=F(b.followers)
  document.getElementById('mLikes').textContent=F(b.likes)
  document.getElementById('mFollowing').textContent=F(b.following||0)
  if(b.bio) document.getElementById('brandBio').textContent=b.bio
  const fc=document.getElementById('mFollowersChg')
  if(b.followers_growth){
    fc.textContent=(b.followers_growth>=0?'+':'')+b.followers_growth
    fc.className='chg'+(b.followers_growth>=0?' up':' down')
  }
  const lc=document.getElementById('mLikesChg')
  if(b.likes_growth){
    lc.textContent=(b.likes_growth>=0?'+':'')+b.likes_growth
    lc.className='chg'+(b.likes_growth>=0?' up':' down')
  }
  if(b.growth_rate) document.getElementById('mGrowth').textContent=(b.growth_rate>=0?'+':'')+b.growth_rate+'%'
  if(b.trend_labels&&b.followers_trend) renderFollowers(b.trend_labels,b.followers_trend)
  renderBenchmark(b.followers)
}

function renderKPI(arr){
  const el=document.getElementById('kpiCards');el.innerHTML=''
  ;(arr||[]).forEach(i=>{
    el.innerHTML+=`<div class="card"><div class="lbl">${i.label}</div><div class="val">${i.value}</div><div class="sub">${i.sub||''}</div></div>`
  })
}

function renderFollowers(labels,data){
  const c=E('chartFollowers')
  c.setOption({
    tooltip:{trigger:'axis',valueFormatter:v=>v.toLocaleString()},
    grid:{left:44,right:10,top:12,bottom:16},
    xAxis:{type:'category',data:labels,axisLabel:{color:'#bbb',fontSize:9}},
    yAxis:{type:'value',splitLine:{lineStyle:{color:'#eee'}},axisLabel:{color:'#bbb'}},
    series:[{
      type:'line',data,smooth:true,symbol:'circle',symbolSize:6,
      lineStyle:{color:'#555',width:2},
      areaStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:'#00000008'},{offset:1,color:'#00000000'}]}},
      itemStyle:{color:'#333'},
      markLine:{data:[{type:'average'}],lineStyle:{color:'#ddd',type:'dashed'},label:{color:'#bbb',fontSize:9,formatter:'均 {c}'}}
    }]
  });R(c)
}

function renderBenchmark(followers){
  const c=E('chartBenchmark')
  c.setOption({
    tooltip:{trigger:'axis'},
    legend:{data:['品牌','市场均','头部'],textStyle:{color:'#bbb',fontSize:9},top:-2,right:0},
    grid:{left:50,right:10,top:28,bottom:16},
    xAxis:{type:'category',data:['粉丝','点赞','互动率'],axisLabel:{color:'#bbb',fontSize:9}},
    yAxis:{type:'value',splitLine:{lineStyle:{color:'#eee'}},axisLabel:{color:'#bbb',fontSize:8}},
    series:[
      {type:'bar',data:[followers||1068,1915,8.4],barWidth:10,itemStyle:{color:'#333',borderRadius:[3,3,0,0]},label:{show:true,position:'top',color:'#333',fontSize:8}},
      {type:'bar',data:[5000,80000,5.2],barWidth:10,itemStyle:{color:'#ccc',borderRadius:[3,3,0,0]},label:{show:true,position:'top',color:'#bbb',fontSize:8}},
      {type:'bar',data:[50000,500000,12.5],barWidth:10,itemStyle:{color:'#999',borderRadius:[3,3,0,0]},label:{show:true,position:'top',color:'#bbb',fontSize:8}}
    ]
  });R(c)
}

function renderVideos(videos){
  const el=document.getElementById('videoGrid')
  document.getElementById('videoLoginTip').style.display='none'
  if(!videos||!videos.length){
    el.innerHTML='<div style="grid-column:1/-1;padding:32px;text-align:center;color:#ccc;background:#fff;border-radius:10px;border:1px solid #eee">暂无视频</div>'
    document.getElementById('videoLoginTip').style.display='block'
    return
  }
  el.innerHTML=videos.map(v=>{
    let cover='📹'
    if(v.cover) cover=`<img src="${v.cover}" alt="" loading="lazy" crossorigin="anonymous" referrerpolicy="no-referrer" onerror="this.onerror=null;this.parentElement.innerHTML='📹'">`
    return `<a href="${v.url||'#'}" target="_blank" class="video-card">
      <div class="video-cover">${cover}<span class="play-badge">${v.views||'0'}</span></div>
      <div class="video-info">
        <div class="vtitle">${v.title||'无标题'}</div>
        <div class="vstats"><span>🔗 ${v.url?.includes('video/')?v.url.split('video/')[1]?.slice(0,8)||'--':'--'}</span></div>
      </div>
    </a>`
  }).join('')
}

function loadDemo(){
  renderBrand({followers:1068,likes:1915,following:2,bio:'Mind is the finest jewel.',followers_growth:21,likes_growth:73,growth_rate:2.0,trend_labels:['06-23','06-24','06-25'],followers_trend:[1047,1055,1068]})
  renderKPI([{label:'粉丝',value:'1,068'},{label:'点赞',value:'1,915'},{label:'关注',value:'2'},{label:'增长',value:'+21'}])
}
</script>
</body>
</html>
