<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MindJewel 品牌看板</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Noto Sans SC','Segoe UI',sans-serif;background:#0b0b0b;color:#eee;min-height:100vh}
a{color:#ffc832;text-decoration:none}

/* Nav */
.nav{display:flex;align-items:center;gap:0;background:#111;border-bottom:1px solid #181818;padding:0 24px}
.nav a{display:flex;align-items:center;gap:6px;padding:14px 18px;font-size:12px;color:#555;border-bottom:2px solid transparent;transition:all .2s}
.nav a:hover{color:#888}
.nav a.active{color:#ffc832;border-bottom-color:#ffc832;background:linear-gradient(0deg,#ffc83206,transparent)}
.nav a span{font-size:14px}

/* Header */
.header{display:flex;justify-content:space-between;align-items:center;padding:20px 24px 12px;margin-bottom:4px}
.h-left{display:flex;align-items:center;gap:14px}
.h-left h1{font-size:18px;font-weight:500;color:#eee}
.h-left h1 span{color:#ffc832}
.meta{font-size:11px;color:#333}

/* Wrap */
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.grid{display:grid;gap:12px;margin-bottom:12px}
.g4{grid-template-columns:repeat(4,1fr)}
.g2{grid-template-columns:1fr 1fr}

/* Brand Hero */
.brand-hero{background:linear-gradient(135deg,#141414,#0d0d0d);border:1px solid #1e1e1e;border-radius:12px;padding:28px 32px;margin-bottom:16px}
.brand-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px}
.brand-identity{display:flex;align-items:center;gap:16px}
.brand-avatar{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#ffc832,#e6a800);color:#111;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:600}
.brand-name{font-size:20px;font-weight:500;color:#eee}
.brand-handle{font-size:13px;color:#555;margin-top:2px}
.brand-bio{font-size:12px;color:#666;margin-top:4px;max-width:400px}
.brand-metrics{display:flex;gap:28px}
.brand-metric{text-align:center}
.brand-metric .val{display:block;font-size:28px;font-weight:300;color:#ffc832;line-height:1.2;font-family:Outfit,sans-serif}
.brand-metric .lbl{font-size:10px;color:#444;text-transform:uppercase;letter-spacing:.3px;margin-top:2px}
.brand-metric .chg{font-size:10px;display:inline-block;padding:1px 6px;border-radius:4px;margin-top:2px}
.brand-metric .chg.up{color:#4caf50;background:#4caf5008}
.brand-metric .chg.down{color:#ef5350;background:#ef535008}
.brand-link{font-size:11px;color:#555;margin-top:8px;display:inline-flex;align-items:center;gap:4px}
.brand-link:hover{color:#ffc832}

/* Cards */
.card{background:#111;border-radius:8px;padding:16px;border:1px solid #181818}
.card .lbl{font-size:10px;color:#444;text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px}
.card .val{font-size:22px;font-weight:300;color:#eee;line-height:1.2}
.card .sub{font-size:10px;color:#2a2a2a;margin-top:1px}

/* Chart */
.cc{background:#111;border-radius:8px;padding:16px;border:1px solid #181818}
.cc h3{font-size:11px;font-weight:400;color:#555;margin-bottom:8px;display:flex;align-items:center;gap:5px}
.cb{width:100%;height:300px}

/* Status */
.status-bar{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px;padding:12px 16px;background:#111;border-radius:8px;border:1px solid #181818;font-size:11px;color:#444}
.status-bar span{display:flex;align-items:center;gap:4px}
.status-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#4caf50}

/* Footer */
.ft{text-align:center;padding:20px 0 6px;font-size:10px;color:#151515}

@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){
  .wrap{padding:0 14px}
  .nav{padding:0 14px;overflow-x:auto}
  .brand-hero{padding:18px 16px}
  .brand-top{flex-direction:column;align-items:flex-start}
  .brand-metrics{gap:16px;width:100%;justify-content:space-around}
  .brand-metric .val{font-size:22px}
  .g4,.g2{grid-template-columns:1fr}
  .cb{height:220px}
}
</style>
</head>
<body>

<div class="nav">
  <a href="index.html"><span>◈</span> 总览</a>
  <a href="brand.html" class="active"><span>🏪</span> 品牌</a>
  <a href="market.html"><span>📊</span> 市场</a>
</div>

<div class="header">
  <div class="h-left">
    <h1>🏪 <span>MindJewel</span> 品牌看板</h1>
  </div>
  <div class="meta"><b id="updateTime">加载中...</b></div>
</div>

<div class="wrap">

  <!-- 品牌信息 -->
  <div class="brand-hero" id="brandHero">
    <div class="brand-top">
      <div class="brand-identity">
        <div class="brand-avatar">M</div>
        <div>
          <div class="brand-name">MindJewel</div>
          <div class="brand-handle">@mindjewel.co</div>
          <div class="brand-bio" id="brandBio">Mind is the finest jewel.</div>
          <a class="brand-link" href="https://www.tiktok.com/@mindjewel.co" target="_blank">打开 TikTok 主页 ↗</a>
        </div>
      </div>
      <div class="brand-metrics">
        <div class="brand-metric">
          <span class="val" id="mFollowers">--</span>
          <span class="lbl">粉丝</span>
          <span class="chg" id="mFollowersChg"></span>
        </div>
        <div class="brand-metric">
          <span class="val" id="mLikes">--</span>
          <span class="lbl">点赞</span>
          <span class="chg" id="mLikesChg"></span>
        </div>
        <div class="brand-metric">
          <span class="val" id="mFollowing">--</span>
          <span class="lbl">关注</span>
        </div>
        <div class="brand-metric">
          <span class="val" id="mGrowth">--</span>
          <span class="lbl">粉丝增长率</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 状态 -->
  <div class="status-bar">
    <span><span class="status-dot"></span> 数据实时</span>
    <span>📱 TikTok 国际版</span>
    <span>💎 珠宝品类</span>
  </div>

  <!-- KPI -->
  <div class="grid g4" id="kpiCards"></div>

  <!-- 粉丝趋势 + 对比市场 -->
  <div class="grid g2">
    <div class="cc"><h3>📈 粉丝增长趋势</h3><div class="cb" id="chartFollowers"></div></div>
    <div class="cc"><h3>⚡ 品牌 vs 市场基准</h3><div class="cb" id="chartBenchmark"></div></div>
  </div>

</div>

<div class="ft">MindJewel 品牌监测 · 每日更新</div>

<script>
function E(id){return echarts.init(document.getElementById(id))}
function R(c){window.addEventListener('resize',()=>c.resize())}
function F(n){return (n||0).toLocaleString()}

fetch('data.json?'+Date.now()).then(r=>r.json()).then(d=>{
  document.getElementById('updateTime').textContent='更新 '+d.updatedAt
  if(d.brand) renderBrand(d.brand)
  else loadDemo()
  if(d.kpi) renderKPI(d.kpi)
}).catch(()=>{
  document.getElementById('updateTime').textContent='⚠️ 加载失败'
  loadDemo()
})

function renderBrand(b){
  document.getElementById('mFollowers').textContent=F(b.followers)
  document.getElementById('mLikes').textContent=F(b.likes)
  document.getElementById('mFollowing').textContent=F(b.following||0)
  if(b.bio) document.getElementById('brandBio').textContent=b.bio

  const fc=document.getElementById('mFollowersChg')
  if(b.followers_growth){
    fc.textContent=(b.followers_growth>=0?'+':'')+b.followers_growth
    fc.className='chg'+(b.followers_growth>=0?' up':' down')
  }
  const lc=document.getElementById('mLikesChg')
  if(b.likes_growth){
    lc.textContent=(b.likes_growth>=0?'+':'')+b.likes_growth
    lc.className='chg'+(b.likes_growth>=0?' up':' down')
  }
  const gc=document.getElementById('mGrowth')
  if(b.growth_rate){
    gc.textContent=(b.growth_rate>=0?'+':'')+b.growth_rate+'%'
  }

  // 粉丝趋势
  if(b.trend_labels&&b.followers_trend){
    renderFollowersChart(b.trend_labels, b.followers_trend)
  }

  // 对比市场
  renderBenchmark(b.followers)
}

function renderKPI(arr){
  const el=document.getElementById('kpiCards');el.innerHTML=''
  ;(arr||[]).forEach(i=>{
    el.innerHTML+=`<div class="card"><div class="lbl">${i.label}</div><div class="val">${i.value}</div><div class="sub">${i.sub||''}</div></div>`
  })
}

function renderFollowersChart(labels, data){
  const c=E('chartFollowers')
  c.setOption({
    tooltip:{trigger:'axis',valueFormatter:v=>v.toLocaleString()},
    grid:{left:44,right:10,top:12,bottom:16},
    xAxis:{type:'category',data:labels,axisLabel:{color:'#444',fontSize:9}},
    yAxis:{type:'value',splitLine:{lineStyle:{color:'#151515'}},axisLabel:{color:'#444'}},
    series:[{
      type:'line',data,smooth:true,symbol:'circle',symbolSize:6,
      lineStyle:{color:'#ffc832',width:2},
      areaStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:'#ffc83218'},{offset:1,color:'#ffc83200'}]}},
      itemStyle:{color:'#ffc832'},
      markLine:{data:[{type:'average'}],lineStyle:{color:'#2a2a2a',type:'dashed'},label:{color:'#444',fontSize:9,formatter:'均 {c}'}}
    }]
  });R(c)
}

function renderBenchmark(followers){
  const c=E('chartBenchmark')
  // 对比数据: 品牌 vs 市场均值 vs 头部账号
  const labels=['粉丝数','点赞数','互动率']
  const brand=[followers||1068, 1915, 8.4]
  const avg=[5000, 80000, 5.2]       // 市场均值
  const top=[50000, 500000, 12.5]    // 头部账号

  c.setOption({
    tooltip:{trigger:'axis'},
    legend:{data:['MindJewel','市场平均','头部账号'],textStyle:{color:'#555',fontSize:9},top:-2,right:0},
    grid:{left:50,right:10,top:28,bottom:16},
    xAxis:{type:'category',data:labels,axisLabel:{color:'#444',fontSize:9}},
    yAxis:{type:'value',splitLine:{lineStyle:{color:'#151515'}},axisLabel:{color:'#444',fontSize:8}},
    series:[
      {type:'bar',data:brand,barWidth:10,itemStyle:{color:'#ffc832',borderRadius:[3,3,0,0]},label:{show:true,position:'top',color:'#ffc832',fontSize:8}},
      {type:'bar',data:avg,barWidth:10,itemStyle:{color:'#555',borderRadius:[3,3,0,0]},label:{show:true,position:'top',color:'#888',fontSize:8}},
      {type:'bar',data:top,barWidth:10,itemStyle:{color:'#4fc3f7',borderRadius:[3,3,0,0]},label:{show:true,position:'top',color:'#888',fontSize:8}}
    ]
  });R(c)
}

function loadDemo(){
  renderBrand({
    followers:1068, likes:1915, following:2, bio:'Mind is the finest jewel. Mindjewel.',
    followers_growth:21, likes_growth:73, growth_rate:2.0,
    trend_labels:['06-23','06-24','06-25'], followers_trend:[1047,1055,1068]
  })
  renderKPI([
    {label:'TikTok 粉丝',value:'1,068',sub:'全球'},{label:'总点赞',value:'1,915',sub:''},
    {label:'关注数',value:'2',sub:''},{label:'近3日增长',value:'+21',sub:'+2.0%'}
  ])
  document.getElementById('updateTime').textContent='更新 示例数据'
}
</script>
</body>
</html>
