name: 更新仪表盘

on:
  schedule:
    # 每天早上 8 点和晚上 8 点自动更新
    - cron: '0 0,12 * * *'
  workflow_dispatch:  # 也可以手动触发

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 更新数据
        run: |
          # 🖊️ 在这里写你的数据采集脚本
          # 比如: python scripts/fetch_data.py
          echo "数据更新时间: $(date)" >> dashboard/data.json

      - name: 推送更新
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add dashboard/
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "auto: 更新仪表盘 $(date +'%Y-%m-%d %H:%M')"
          git push
